name: Build Realme 8 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2-nashc

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            python3 \
            rsync \
            cpio \
            kmod \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Setup Clang
        run: |
          sudo apt-get install -y clang lld llvm

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 nashc_defconfig
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Verify build outputs
        run: |
          test -f out/arch/arm64/boot/Image.gz
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -print
          ls -lh out/arch/arm64/boot/Image.gz

      - name: Package kernel artifacts
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/
          cp -r out/arch/arm64/boot/dts artifacts/dts

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: realme8-kernel-${{ github.sha }}
          path: artifacts/
          retention-days: 7
